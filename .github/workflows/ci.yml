name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, type-check, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cuesense
          POSTGRES_PASSWORD: cuesense
          POSTGRES_DB: cuesense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuesense -d cuesense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cuesense:cuesense@localhost:5432/cuesense
      TEST_DATABASE_URL: postgresql+psycopg://cuesense:cuesense@localhost:5432/cuesense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy app tests
      - name: Test
        run: pytest

  web:
    name: web (lint, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Type-check
        run: pnpm --filter web typecheck
      - name: Test
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Migrate and seed
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.scripts.seed
      - name: Wait for the web app
        run: curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3000/ > /dev/null
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter web e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Show stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
