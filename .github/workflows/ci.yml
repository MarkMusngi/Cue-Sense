name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, type-check, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cuesense
          POSTGRES_PASSWORD: cuesense
          POSTGRES_DB: cuesense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuesense -d cuesense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cuesense:cuesense@localhost:5432/cuesense
      TEST_DATABASE_URL: postgresql+psycopg://cuesense:cuesense@localhost:5432/cuesense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy app tests
      - name: Test
        run: pytest

  web:
    name: web (lint, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Type-check
        run: pnpm --filter web typecheck
      - name: Build
        run: pnpm --filter web build
